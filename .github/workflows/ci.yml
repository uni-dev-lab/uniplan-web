name: Angular CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: uniplanWeb

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: 'uniplanWeb/.nvmrc'
          cache: 'npm'
          cache-dependency-path: uniplanWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage | tee test-output.log

      - name: Build
        run: npm run build | tee build-output.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo '```'
            if [ -f test-output.log ]; then
              grep -A 5 "Coverage summary" test-output.log || echo "No coverage data captured."
            else
              echo "Tests did not run (an earlier step failed)."
            fi
            echo '```'
            echo
            echo "## Initial bundle size"
            echo '```'
            if [ -f build-output.log ]; then
              grep -A 5 "Initial chunk files" build-output.log || echo "No build output captured."
            else
              echo "Build did not run (an earlier step failed)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

