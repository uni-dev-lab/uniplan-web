<app-add-form [title]="'department.add.title' | translate"  (saveClicked)="save()">
  <mat-dialog-content>

    <mat-form-field appearance="fill">
      <mat-label>{{ 'features.name-label' | translate }}</mat-label>
      <input matInput [(ngModel)]="departmentName" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>{{ 'features.faculty-label' | translate }}</mat-label>
      <mat-select [(ngModel)]="facultyId">
        @for (fac of faculties; track fac) {
          <mat-option [value]="fac.id">
            {{ fac.facultyName }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

  </mat-dialog-content>
</app-add-form>
