<app-edit-form [title]="'lector.edit.title' | translate" (saveClicked)="save()">

  <mat-form-field appearance="fill">
    <mat-label>{{ 'features.name-label' | translate }}</mat-label>
    <input matInput [(ngModel)]="firstName" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>{{ 'lector.last-name-label' | translate }}</mat-label>
    <input matInput [(ngModel)]="lastName" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>{{ 'lector.email-label' | translate }}</mat-label>
    <input matInput type="email" [(ngModel)]="email" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>{{ 'features.faculty-label' | translate }}</mat-label>
    <mat-select [(ngModel)]="facultyId">
      @for (fac of faculties; track fac) {
        <mat-option [value]="fac.id">
          {{ fac.facultyName }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

</app-edit-form>
