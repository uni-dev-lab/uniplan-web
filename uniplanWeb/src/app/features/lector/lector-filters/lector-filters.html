<div class="filters-panel">
    <app-input-filter
        [label]="'features.lector-label' | translate"
        [searchText]="lectorFiltersState().searchText"
        (searchTextChange)="searchTextChange.emit($event)">
    </app-input-filter>
    <app-filters-form
      [label]="'features.faculty-label' | translate"
      [objectOptions]="lectorFiltersState().faculties"
      [selected]="lectorFiltersState().selectedFaculty"
        (selectionChange)="facultyChange.emit($event)"
        class="filter">
    </app-filters-form>
</div>
