<div class="component-panel student">

  <app-responsive-filters
    [filters]="responsiveFilterValues()"
    [emptyFilters]="emptyResponsiveFilters"
    (filtersChange)="onResponsiveFiltersChange($event)">

    <app-student-options filterOptions></app-student-options>

    <ng-template
      #filterFields
      let-draft
      let-update="update">

      <app-student-filters
        [internalSearchText]="draft.internalSearchText"
        [internalSearchFacNum]="draft.searchFacNum"
        [internalSearchMajor]="draft.searchMajor"
        [selectedSubtype]="draft.selectedSubtype"
        [subtypes]="studentFilterOptions().subtypes"

        (searchTextChange)="update({ internalSearchText: $event })"
        (searchFacNumChange)="update({ searchFacNum: $event })"
        (searchMajorChange)="update({ searchMajor: $event })"
        (subtypeChange)="update({ selectedSubtype: $event })">
      </app-student-filters>

    </ng-template>

  </app-responsive-filters>

  <app-student-table
    [searchText]="internalSearchText()"
    [searchFacNum]="studentFilterState().searchFacNum"
    [searchMajor]="studentFilterState().searchMajor"
    [subtype]="studentFilterState().selectedSubtype"
    [subtypes]="studentFilterOptions().subtypes"
    (subtypesLoaded)="studentFilterOptions.set({ subtypes: $event })">
  </app-student-table>

</div>
