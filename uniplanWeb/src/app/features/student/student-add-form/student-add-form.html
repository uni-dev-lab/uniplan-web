<app-add-form title="Добави Студент" (saveClicked)="save()">
    <mat-dialog-content>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'student.name-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="studentName" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'student.faculty-number-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="facultyNumber" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'student.faculty-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="faculty" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'student.major-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="major" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'student.course-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="course" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'student.type-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="type" />
        </mat-form-field>

    </mat-dialog-content>
</app-add-form>
