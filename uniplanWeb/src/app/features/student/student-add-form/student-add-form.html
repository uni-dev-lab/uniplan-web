<app-add-form title="Добави Студент" (saveClicked)="save()">
  <mat-dialog-content [formGroup]="studentForm">

    <mat-form-field appearance="fill">
      <mat-label>Име:</mat-label>
      <input matInput formControlName="studentName" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Факултетен номер:</mat-label>
      <input matInput formControlName="facultyNumber" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Факултет:</mat-label>
      <input matInput formControlName="faculty" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Специалност:</mat-label>
      <input matInput formControlName="major" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Курс:</mat-label>
      <input matInput formControlName="course" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Тип:</mat-label>
      <input matInput formControlName="type" />
    </mat-form-field>

  </mat-dialog-content>
</app-add-form>
