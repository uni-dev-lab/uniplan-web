<app-add-form title="Добави Студент" (saveClicked)="save()">
    <mat-dialog-content>

        <mat-form-field appearance="fill">
            <mat-label>Име:</mat-label>

            <input matInput [(ngModel)]="studentName" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Факултетен номер:</mat-label>
            <input matInput [(ngModel)]="facultyNumber" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Факултет:</mat-label>
            <input matInput [(ngModel)]="faculty" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Специалност:</mat-label>
          <mat-select [value]="major" (selectionChange)="onMajorChange($event.value)">
            @for (majorItem of majors; track majorItem.majorId) {
              <mat-option [value]="majorItem.majorName">
                {{ majorItem.majorName }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Курс:</mat-label>
          <mat-select [value]="course" (selectionChange)="onCourseChange($event.value)">
            @for (courseItem of courses; track courseItem) {
              <mat-option [value]="courseItem">
                {{ courseItem }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Тип:</mat-label>
          <mat-select [value]="type" (selectionChange)="onTypeChange($event.value)">
            @for (typeItem of types; track typeItem) {
              <mat-option [value]="typeItem">
                {{ typeItem }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>

    </mat-dialog-content>
</app-add-form>
