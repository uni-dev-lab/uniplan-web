<app-add-form title="Добави Факултет" (saveClicked)="save()">
  <mat-dialog-content [formGroup]="facultyForm">

    <mat-form-field appearance="fill">
      <mat-label>Име:</mat-label>
      <input matInput formControlName="facultyName" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Локация:</mat-label>
      <input matInput formControlName="location" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Университет:</mat-label>
      <mat-select formControlName="universityId">
        @for (uni of universities; track uni) {
          <mat-option [value]="uni.id">
            {{uni.uniName}}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

  </mat-dialog-content>
</app-add-form>
