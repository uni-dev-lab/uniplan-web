<app-edit-form title="Редактирай факултет" (saveClicked)="save()">
    <mat-dialog-content>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'faculty.faculty-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="facultyName" />
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>{{ 'faculty.location-label' | translate }}</mat-label>
            <input matInput [(ngModel)]="location" />
        </mat-form-field>

    </mat-dialog-content>
</app-edit-form>
