<div class="table-wrapper">
  <table mat-table [dataSource]="(data$ | async) ?? []" class="mat-elevation-z8 table-header">
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef class="col-position"> No. </th>
    </ng-container>

    <ng-container matColumnDef="facultyId">
      <th mat-header-cell *matHeaderCellDef class="col-name">{{ 'features.faculty-label' | translate }} </th>
    </ng-container>

    <ng-container matColumnDef="roomNumber">
      <th mat-header-cell *matHeaderCellDef class="col-room-number"> {{ 'room.room-number' | translate }} </th>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="col-actions"> {{ 'features.actions-label' | translate }} </th>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  </table>

  <div class="scrollable-body">
    <table mat-table [dataSource]="(data$ | async) ?? []" class="mat-elevation-z8 table-body">
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          {{ 'room.no-rooms' | translate }}
        </td>
      </tr>


      <ng-container matColumnDef="position">
        <td mat-cell *matCellDef="let element" class="col-position">
          {{element.position}} </td>
      </ng-container>

      <ng-container matColumnDef="facultyId">
        <td mat-cell *matCellDef="let element" class="col-name">
          {{getFacultyName(element.facultyId)}} </td>
      </ng-container>


      <ng-container matColumnDef="roomNumber">
        <td mat-cell *matCellDef="let element" class="col-room-number">
          {{ element.roomNumber }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <td mat-cell *matCellDef="let element" class="col-actions">
          <button mat-icon-button color="primary">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
