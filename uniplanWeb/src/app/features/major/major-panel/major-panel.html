<div class="component-panel major">
  <div class="panel-controls-row">
    <app-major-options class="panel-options"></app-major-options>
    <app-major-filters
      [majorFilterState]="majorFiltersState()"
      [majorFilterOptions]="majorFilterOptions()"
      (facultyChange)="updateFilters({ selectedFaculty: $event })"
      (typeChange)="updateFilters({ selectedType: $event })"
      (subtypeChange)="updateFilters({ selectedSubtype: $event })"
      (searchTextChange)="internalSearchText.set($event)">
    </app-major-filters>
  </div>
  <app-major-table
    [majorFiltersState]="majorFiltersState()"
    [searchText]="internalSearchText()">
  </app-major-table>
</div>
