<div class="component-panel major">
  <div class="panel-controls-row">
    <app-major-options class="panel-options"></app-major-options>
    <app-major-filters
      [majorFilterState]="majorFiltersState"
      [majorFilterOptions]="majorFilterOptions"
      (facultyChange)="majorFiltersState.selectedFaculty = $event"
      (typeChange)="majorFiltersState.selectedType = $event"
      (subtypeChange)="majorFiltersState.selectedSubtype = $event"
      (searchTextChange)="internalSearchText = $event">
    </app-major-filters>
  </div>
  <app-major-table
    [majorFiltersState]="majorFiltersState"
    [searchText]="internalSearchText">
  </app-major-table>
</div>
