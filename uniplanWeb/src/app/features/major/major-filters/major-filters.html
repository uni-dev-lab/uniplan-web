<div class="filters-panel">
    <app-input-filter [label]="'features.major-label' | translate" [(searchText)]="internalSearchText"
        (searchTextChange)="searchTextChange.emit($event)">
    </app-input-filter>
    <app-filters-form [label]="'features.faculty-label' | translate" [objectOptions]="faculties"
        [selected]="selectedFaculty" (selectionChange)="facultyChange.emit($event)" class="filter">
    </app-filters-form>

    <app-filters-form [label]="'features.type-label' | translate" [options]="types" [selected]="selectedType"
        (selectionChange)="typeChange.emit($event)" class="filter">
    </app-filters-form>

    <app-filters-form [label]="'features.study-mode-label' | translate" [options]="subtypes"
        [selected]="selectedSubtype" (selectionChange)="subtypeChange.emit($event)" class="filter">
    </app-filters-form>
</div>
