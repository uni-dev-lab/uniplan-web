<div class="filters-panel">
    <app-input-filter [label]="'features.major-label' | translate" [searchText]="internalSearchText()"
        (searchTextChange)="searchTextChange.emit($event)">
    </app-input-filter>
  <app-filters-form [label]="'features.faculty-label' | translate" [objectOptions]="majorFilterOptions().faculties"
                    [selected]="majorFilterState().selectedFaculty" (selectionChange)="facultyChange.emit($event)"
                    class="filter">
    </app-filters-form>

  <app-filters-form [label]="'features.type-label' | translate" [options]="majorFilterOptions().types"
                    [selected]="majorFilterState().selectedType"
        (selectionChange)="typeChange.emit($event)" class="filter">
    </app-filters-form>

  <app-filters-form [label]="'features.study-mode-label' | translate" [options]="majorFilterOptions().subtypes"
                    [selected]="majorFilterState().selectedSubtype" (selectionChange)="subtypeChange.emit($event)"
                    class="filter">
    </app-filters-form>
</div>
