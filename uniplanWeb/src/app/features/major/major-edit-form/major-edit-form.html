<app-edit-form [title]="'major.edit.title' | translate" (saveClicked)="save()">
  <mat-dialogue-content [formGroup]="majorForm">

    <mat-form-field appearance="fill">
      <mat-label>{{ 'features.name-label' | translate }}</mat-label>
      <input matInput formControlName="majorName" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>{{ 'features.faculty-label' | translate }}</mat-label>
      <mat-select formControlName="facultyId">
        @for (fac of faculties; track fac.id) {
      <mat-option [value]="fac.id">
        {{ fac.facultyName }}
      </mat-option>
        }
      </mat-select>
    </mat-form-field>

  </mat-dialogue-content>
</app-edit-form>
