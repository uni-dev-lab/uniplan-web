<h2 mat-dialog-title>{{title}}</h2>
<mat-dialog-content>

    <ng-content></ng-content>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close
        class="exitButton">{{'shared.exit-button' | translate}}</button>
    <button mat-raised-button (click)="saveClicked.emit()"
        class="saveButton">{{'shared.save-button' | translate}}</button>
</mat-dialog-actions>
